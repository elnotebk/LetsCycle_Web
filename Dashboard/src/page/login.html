<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#3A7D44">
    <meta name="description" content="Masuk ke akun LetCycle dan lanjutkan langkah baikmu untuk bumi.">
    <title>Masuk | LetCycle</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/auth.css">
    <script type="module" src="LoginPage.js"></script>
    <script type="module" src="../component/NavbarComponent.js"></script>
</head>

<body class="auth-page">
    <header class="site-header">
        <div class="nav-container">
            <a class="brand" href="../../index.html" aria-label="LetCycle, halaman utama">
                <span>Let<span>Cycle</span></span>
            </a>
            <nav class="main-nav" aria-label="Navigasi utama">
                <a class="nav-link" href="#">Home</a>
                <a class="nav-link" href="#">Lokasi Penukaran</a>
                <a class="nav-link" href="#">Marketplace</a>
            </nav>
            <div class="auth-actions" data-navbar-auth></div>
        </div>
    </header>

    <main class="auth-main">
        <section class="auth-card" aria-labelledby="login-title">
            <div class="auth-card-heading">
                <p class="eyebrow">Selamat datang kembali</p>
                <h1 id="login-title">Masuk ke LetCycle</h1>
                <p>Lanjutkan kebiasaan baikmu untuk bumi yang lebih bersih.</p>
            </div>
            <form class="auth-form" id="login-form" novalidate>
                <div class="form-field">
                    <label for="login-email">Email</label>
                    <input id="login-email" name="email" type="email" autocomplete="email" maxlength="254" placeholder="nama@email.com" required>
                    <span class="field-error" id="login-email-error" data-field-error="email"></span>
                </div>
                <div class="form-field">
                    <label for="login-password">Password</label>
                    <div class="input-wrap">
                        <input id="login-password" name="password" type="password" autocomplete="current-password" maxlength="128" placeholder="Masukkan password" required>
                        <button class="password-toggle" type="button" data-toggle-password="login-password" aria-label="Tampilkan password">Tampilkan</button>
                    </div>
                    <span class="field-error" id="login-password-error" data-field-error="password"></span>
                </div>
                <p class="form-status" data-form-status role="status" aria-live="polite"></p>
                <button class="auth-submit" type="submit">Masuk</button>
            </form>
            <p class="auth-switch">Belum punya akun? <a href="register.html">Daftar</a></p>
            <p class="auth-security-note">
                Mode uji lokal: password disimpan sebagai hash, bukan teks asli.
            </p>
        </section>
    </main>
</body>

</html>
