<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#3A7D44">
    <meta name="description" content="Temukan lokasi penukaran sampah LetCycle terdekat.">
    <title>Lokasi Penukaran | LetCycle</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

<body class="min-h-screen [--text-muted:#6B7470]" data-location-page>
    <header class="site-header sticky top-0 z-20 w-full bg-[linear-gradient(105deg,#1F5C2E,#3A7D44)] text-white shadow-[0_8px_20px_rgba(23,74,41,0.15)]">
        <div class="relative mx-auto grid min-h-[72px] w-[min(100%,1200px)] grid-cols-[1fr_auto_1fr] mobile:grid-cols-[auto_1fr_auto] items-center px-7 mobile:min-h-[60px] mobile:w-full mobile:gap-2.5 mobile:px-[13px] tiny:gap-1.5 tiny:px-3.5">
            <a class="brand inline-flex w-fit items-center gap-2 text-[23px] font-extrabold tracking-[-0.8px] text-white mobile:gap-1.5 mobile:text-[17px] mobile:tracking-[-0.5px] tiny:text-[15px]" href="../Dashboard/index.html" aria-label="LetCycle, halaman utama">
                <span>Let<span>Cycle</span></span>
            </a>
            <nav class="main-nav flex items-center gap-[38px] mobile:justify-self-center mobile:gap-[clamp(8px,2.8vw,17px)] tiny:gap-[7px]" aria-label="Navigasi utama">
                <a class="nav-link relative py-6 text-[15px] font-semibold text-white transition-colors duration-[160ms] aria-[current=page]:after:absolute aria-[current=page]:after:inset-x-0 aria-[current=page]:after:bottom-[15px] aria-[current=page]:after:h-px aria-[current=page]:after:rounded-[2px] aria-[current=page]:after:bg-white aria-[current=page]:after:content-[''] mobile:py-[19px] mobile:text-[clamp(9px,2.6vw,12px)] mobile:aria-[current=page]:after:bottom-3" href="../Dashboard/index.html">Home</a>
                <a class="nav-link relative py-6 text-[15px] font-semibold text-white transition-colors duration-[160ms] aria-[current=page]:after:absolute aria-[current=page]:after:inset-x-0 aria-[current=page]:after:bottom-[15px] aria-[current=page]:after:h-px aria-[current=page]:after:rounded-[2px] aria-[current=page]:after:bg-white aria-[current=page]:after:content-[''] mobile:py-[19px] mobile:text-[clamp(9px,2.6vw,12px)] mobile:aria-[current=page]:after:bottom-3" href="index.html" aria-current="page">Lokasi Penukaran</a>
                <a class="nav-link relative py-6 text-[15px] font-semibold text-white transition-colors duration-[160ms] aria-[current=page]:after:absolute aria-[current=page]:after:inset-x-0 aria-[current=page]:after:bottom-[15px] aria-[current=page]:after:h-px aria-[current=page]:after:rounded-[2px] aria-[current=page]:after:bg-white aria-[current=page]:after:content-[''] mobile:py-[19px] mobile:text-[clamp(9px,2.6vw,12px)] mobile:aria-[current=page]:after:bottom-3" href="../Marketplace/index.html">Marketplace</a>
            </nav>
            <div class="relative flex items-center justify-self-end gap-6 text-[14px] font-bold data-[signed-in]:gap-3 mobile:gap-2 mobile:text-[10px] mobile:data-[signed-in]:gap-0 tiny:gap-1.5 tiny:text-[9px] tiny:data-[signed-in]:gap-1.5" data-navbar-auth></div>
        </div>
    </header>

    <main class="min-h-[550px] bg-paper pb-[34px] pt-[25px] md-down:min-h-0 md-down:pb-[30px] md-down:pt-[22px]">
        <section class="mx-auto w-page mobile:w-page-sm mb-1" aria-labelledby="location-title">
            <h1 class="text-[clamp(22px,2.4vw,30px)] font-extrabold leading-[1.35] tracking-[-0.7px] text-teal phone:text-[23px]" id="location-title">Lokasi Penukaran</h1>
            <p class="ml-1 mt-px text-[13px] text-muted phone:ml-0 phone:text-[12px]">Temukan Tempat Penukaran Sampah Terdekat</p>
        </section>

        <section class="mx-auto w-page mobile:w-page-sm mt-1.5 grid grid-cols-2 items-stretch gap-7 md-down:mt-3.5 md-down:grid-cols-[minmax(0,1fr)] md-down:gap-[18px] phone:gap-[15px]" aria-label="Cari dan lihat lokasi penukaran">
            <article class="flex h-[480px] min-w-0 flex-col rounded-2xl border border-[#D5D9D1] bg-white p-4 shadow-[0_12px_32px_rgba(38,50,56,0.08)] phone:rounded-[13px] phone:p-[13px] md-down:h-[440px] phone:h-[420px]" aria-labelledby="search-title">
                <h2 class="mb-3 flex min-h-[23px] items-center gap-2 text-[16px] font-bold leading-[1.4] text-teal phone:text-[14px]" id="search-title">
                    <svg class="h-[18px] w-[18px] flex-[0_0_18px] stroke-primary stroke-[1.8] fill-none [stroke-linecap:round] [stroke-linejoin:round]" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"></path>
                        <circle cx="12" cy="10" r="2.5"></circle>
                    </svg>
                    Cari Lokasi Penukaran
                </h2>
                <div class="mb-2.5 grid grid-cols-[minmax(0,1fr)_auto] gap-[9px] phone:gap-[7px]">
                    <div data-location-search></div>
                    <div class="relative z-[5]" data-city-filter></div>
                </div>
                <div class="thin-scrollbar min-h-0 flex-1 overflow-y-auto overscroll-contain border-t border-[#DCE2DB]" data-location-list aria-live="polite"></div>
            </article>

            <article class="flex h-[480px] min-w-0 flex-col rounded-2xl border border-[#D5D9D1] bg-white p-4 shadow-[0_12px_32px_rgba(38,50,56,0.08)] phone:rounded-[13px] phone:p-[13px] md-down:h-[370px] md-down:min-h-[320px] phone:h-[340px]" aria-labelledby="map-title">
                <h2 class="mb-3 flex min-h-[23px] items-center gap-2 text-[16px] font-bold leading-[1.4] text-teal phone:text-[14px]" id="map-title">
                    <svg class="h-[18px] w-[18px] flex-[0_0_18px] stroke-primary stroke-[1.8] fill-none [stroke-linecap:round] [stroke-linejoin:round]" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3z"></path>
                        <path d="M9 3v15m6-12v15"></path>
                    </svg>
                    Peta Lokasi
                </h2>
                <div class="relative min-h-0 flex-1 overflow-hidden rounded-[11px] bg-soft" data-location-map></div>
            </article>
        </section>
    </main>

    <footer class="bg-ink pt-[54px] text-white mobile:pt-[31px]" data-site-footer></footer>
</body>

</html>
